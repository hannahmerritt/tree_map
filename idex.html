   <script type="module">

            mapboxgl.accessToken = 'pk.eyJ1IjoicXV3YWNrLWpvbmVzIiwiYSI6ImNtaDJkcjBzNzBiOGoyam9ib2Q4bGZkNTUifQ.tcdpJ47sN7uE8gEREB17MQ'
            
            // initializing map
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/quwack-jones/cmifaipkf000101sq1p2ibnz2', // custom basemap
                center: [-122.3035, 47.6553],
                zoom: 12,
            });

            // ensures that everything is loaded properly before continuing onto other things
            async function makeMap() {
                map.on('load', () => {
                    // add bus route lines
                    map.addSource('uw-routes', {
                        type: 'geojson',
                        data: 'assets/routes_uw.geojson'
                    });

                    map.addLayer({
                        'id': 'uw-route-lines',
                        'type': 'line',
                        'source': 'uw-routes',
                        'slot': 'middle', // allows street labels to appear over route lines
                        'layout': {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        'paint': {
                            'line-width': 3,
                            'line-color': '#53585C', // default gray color
                        }
                    });

                    // add bus stop points
                    map.addSource('uw-stops', {
                        type: 'geojson',
                        data: 'assets/stops_uw.geojson'
                    });

                    map.addLayer({
                        'id': 'uw-stops',
                        'type': 'circle',
                        'source': 'uw-stops',
                        'minzoom': 14, // only show stops when zoomed in to this level
                        'paint': {
                            'circle-radius': 5,
                            'circle-color': '#6C7278', // default gray color
                            'circle-stroke-width': 1,
                            'circle-stroke-color': '#fff'
                        }
                    });

                    // add pop-ups for stops
                    map.on('click', 'uw-stops', (e) => {
                        const feature = e.features[0];
                        const coordinates = feature.geometry.coordinates.slice();
                        const props = feature.properties;

                        const description = `
                            <b>Stop Address:</b> ${props.stop_name}
                        `;

                        new mapboxgl.Popup()
                            .setLngLat(coordinates)
                            .setHTML(description)
                            .addTo(map);
                    });

                    // setting up menu logic from external module; controls visibility of routes and bus stops
                    menuLogic(map);

                    // add live bus positions
                    // first add empty source and layer
                  //  map.addSource('live-buses', {
                    //    type: 'geojson',
                      //  data: {"type": "FeatureCollection", "features": []}
                  //  });

                    // styling for bus positions based on route_num
                    map.addLayer({
                        'id': 'live-bus-positions',
                        'type': 'circle',
                        'source': 'live-buses',
                        'paint': {
                            'circle-radius': 6,
                            'circle-stroke-width': 1.5,
                            'circle-stroke-color': '#000000',
                            'circle-color': [
                                'match',
                                ['get', 'route_num'],
                                '43', '#EB2A22', // red
                                '44', '#3E6ECF', // blue
                                '45', '#4DBA4A', // green
                                '48', '#984EBD', // purple
                                '49', '#FF6B00', // orange
                                '65', '#FFE023', // yellow
                                '67', '#4EF6EB', // teal
                                '70', '#FB3BA6', // pink
                                '#AAAAAA' // default color for other routes (necessary for code to work but doesn't actually appear on the map)
                            ]
                        }
                    });

                  
                        // what's shown in the pop-up
                        const popupContent = `
                            <strong>Route #:</strong> ${props.route_num} <br>
                            <strong>Headsign:</strong> ${props.headsign_primary} <br>
                            ${
                                props.headsign_secondary 
                                ? `<strong>Secondary Headsign:</strong> ${props.headsign_secondary} <br>` 
                                : ""
                            }
                            <strong>Label:</strong> ${props.label} <br>
                        `;

                        // creating a new pop-up at new bus position
                        activeBusPopup = new mapboxgl.Popup({closeOnClick: false})
                            .setLngLat([coords[0], coords[1]])
                            .setHTML(popupContent)
                            .addTo(map);
                    });

                  

                    // setting up menu button event listeners
                    function setupRouteButtons() {
                        const buttons = document.querySelectorAll('.route-btn');

                        buttons.forEach(btn => {
                            btn.addEventListener('click', () => {
                                const routeText = btn.textContent.trim(); 
                                const routeName = routeText.replace('Route ', ''); 

                                // if the same button has been clicked again, enable all buttons
                                if (currentSelectedRoute === routeName) {
                                    currentSelectedRoute = null;
                                    setRouteStyle(null);
                                    buttons.forEach(b => {
                                        b.classList.remove('disabled');
                                        b.disabled = false;
                                        b.removeAttribute('aria-disabled'); // for accessibility
                                    });
                                    return;
                                }

                                // keep track of selected route and update styles
                                currentSelectedRoute = routeName;
                                setRouteStyle(routeName);

                                // update button states
                                buttons.forEach(b => {
                                    if (b === btn) {
                                        b.classList.add('active');
                                        b.classList.remove('disabled');
                                        b.disabled = false;
                                        b.removeAttribute('aria-disabled'); // for accessibility
                                    } else {
                                        b.classList.remove('active');
                                        b.classList.add('disabled');
                                        b.disabled = true;
                                        b.setAttribute('aria-disabled', 'true'); // for accessibility
                                    }
                                });
                            });
                        });
                    }

                    setupRouteButtons();
                });
            }

            // tutorial pop-up logic
            const tutorialSlides = [
                `
                <h2>Welcome to the UW Bus Map!</h2>
                <p>This site shows live bus locations around the UW Seattle campus, updated every 7 seconds.</p>
                `,
                `
                <h2>Click Moving Buses</h2>
                <p>Select any moving bus to see its route number, headsign(s), and label in a pop-up.</p>
                <img src="report_images/live_bus_popup.png">
                `,
                `
                <h2>Click Stops</h2>
                <p>Select any bus stop to see its address in a pop-up.</p>
                <img src="report_images/bus_stop_popup.png">
                `,
                `
                <h2>Select Routes</h2>
                <p>Use the left menu to highlight and focus on a specific route.</p>
                <img src="report_images/menu_selection.png">
                <p>Click the route again to exit the route.</p>
                `,
                `
                <h2>Tilt the Map</h2>
                <p>Hold CTRL while dragging on the map to view 3D buildings at different angles.</p>
                <img src="report_images/3d_buildings_tilted.png">
                `,
                `
                <h2>You're ready to use the map!</h2>
                `
            ];

            let tutorialIndex = 0;

            const overlay = document.getElementById('tutorialOverlay');
            const content = document.getElementById('tutorialContent');

            function updateTutorial() {
                content.innerHTML = tutorialSlides[tutorialIndex];

                if (tutorialIndex == 5) {
                    // if you're on the last slide, don't have a "next" button
                    document.getElementById('prevSlide').style.display = "block";
                    document.getElementById('nextSlide').style.display = "none";
                } else if (tutorialIndex == 0) {
                    // if you're on the first slide, don't have a "back" button
                    document.getElementById('nextSlide').style.display = "block";
                    document.getElementById('prevSlide').style.display = "none";
                } else {
                    // have a "next" and "back" button for all other slides
                    document.getElementById('nextSlide').style.display = "block";
                    document.getElementById('prevSlide').style.display = "block";
                }
            }

            // initialize tutorial content but don't show it 
            updateTutorial();

            // how to advance to the next slide
            document.getElementById('nextSlide').addEventListener('click', () => {
                if (tutorialIndex < tutorialSlides.length - 1) {
                    tutorialIndex++;
                    updateTutorial();
                }
            });

            // how to go back to the previous slide
            document.getElementById('prevSlide').addEventListener('click', () => {
                if (tutorialIndex > 0) {
                    tutorialIndex--;
                    updateTutorial();
                }
            });

            // how to exit out of the tutorial pop-up
            document.getElementById('tutorialClose').addEventListener('click', () => {
                overlay.classList.remove('visible'); 
                // hides popup
            });

            // only show tutorial content when user hits ? button
            document.getElementById('help-button').addEventListener('click', () => {
                tutorialIndex = 0;
                updateTutorial();
                overlay.classList.add('visible');
            });

            makeMap();
        </script>

        <!-- javascript for topnav -->
        <script src="topnav/topnav_logic.js"></script>
    </body>
</html>
