```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seattle Tree Map</title>

    <!-- Mapbox CSS -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #map-title {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1;
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
        }
        #layer-controls {
            position: absolute;
            top: 65px;
            left: 15px;
            z-index: 2;
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="map-title">Seattle Tree Map</div>

    <div id="layer-controls">
        <label>
            <input type="checkbox" id="toggle-individual-trees" checked>
            Show individual trees
        </label>
    </div>

    <!-- Mapbox JavaScript -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>

    <script>
        // Mapbox access token
        mapboxgl.accessToken = 'pk.eyJ1IjoiaG1lcnJpdHQxMSIsImEiOiJjbWhqcHRpOWgxMjA1MmxwbjdqY2x2dzdiIn0.Y0OZ2_z34S1hWXsgpOP19A';

        // Create the map
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-122.382, 47.675],
            zoom: 13
        });

        // Zoom and rotation buttons
        map.addControl(new mapboxgl.NavigationControl());

        // Load data after the basemap is ready
        map.on('load', function () {

            // 
            // TREE COLORS
            // 

           const gridFiles = [
                'data/Adams_grid.geojson',
                'data/sh_grid2.geojson',
                'data/lh_done.geojson',
               'data/wh_pr_grid.geojson'
            ];
            
            Promise.all(
                gridFiles.map(file =>
                    fetch(file).then(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to load ${file}`);
                        }
                        return response.json();
                    })
                )
            ).then(datasets => {
                const combinedGrid = {
                    type: 'FeatureCollection',
                    features: datasets.flatMap(data => data.features)
                };
            
                map.getSource('tree-grid').setData(combinedGrid);
            }).catch(error => console.error(error));
            
            map.addSource('tree-grid', {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: []
                }
            });

            map.addLayer({
                id: 'tree-grid-points',
                type: 'circle',
                source: 'tree-grid',

                paint: {
                    // Size of each grid point
                  'circle-radius': [
                    'interpolate',
                    ['exponential', 2],
                    ['zoom'],
                    10, 1.7,
                    12, 6.8,
                    14, 27.3,
                    16, 109.2,
                    18, 436.8
                ],

                    // Color based on the numeric category field
                    'circle-color': [
                        'match',
                        ['get', 'TREE_CATEGORY'],
                        'Maple', '#e76f51',
                        'Oak', '#577590',
                        'Cherry & Other Flowering', '#6d597a',
                        'Conifers', '#2a9d8f',
                        'Other Broadleaf', '#8ab17d',
                        'Fruit & Nut', '#b07aa1',
                        'Other / Unknown', '#64748B',
                        '#cccccc'
                    ],

                    // More dominant tree = more opaque point
                    // Ratio is stored from 0 to 1
                    'circle-opacity': [
                        'interpolate',
                        ['linear'],
                        ['to-number', ['get', 'ratio']],
                        0, 0.2,
                        1, 0.9
                    ],

                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 0
                }
            });

            // Click a grid point to see its tree information
            // Click a grid point to see its tree information
            map.on('click', 'tree-grid-points', function (event) {
                const properties = event.features[0].properties;
            
                new mapboxgl.Popup()
                    .setLngLat(event.lngLat)
                    .setHTML(
                        '<strong>Dominant tree:</strong> ' +
                        (properties.COMMON_NAME || 'Unknown') +
                        '<br><strong>Dominant tree count:</strong> ' +
                        (properties.count ?? 'Unknown') +
                        '<br><strong>Total trees:</strong> ' +
                        (properties.total_trees ?? 'Unknown') +
                        '<br><strong>Share of trees:</strong> ' +
                        (properties.ratio != null
                            ? (Number(properties.ratio) * 100).toFixed(1) + '%'
                            : 'Unknown') +
                        '<br><strong>Category:</strong> ' +
                        (properties.TREE_CATEGORY || 'Unknown')
                    )
                    .addTo(map);
            });

            map.on('mouseenter', 'tree-grid-points', function () {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'tree-grid-points', function () {
                map.getCanvas().style.cursor = '';
            });


            //
            //  TREE LOCATIONS
            // 

            map.addSource('ballard-trees', {
                type: 'geojson',
                data: 'data/ballard_trees.geojson'
            });

            map.addLayer({
                id: 'ballard-trees-points',
                type: 'circle',
                source: 'ballard-trees',

                 layout: {
                    'visibility': 'none'
                },

                paint: {
                    'circle-radius': 3,
                    'circle-color': '#228B22',
                    'circle-opacity': 0.7,
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 0.3
                }
            });
                // toggle individual trees on and off map
            document.getElementById('toggle-individual-trees')
                .addEventListener('change', function (event) {
                    map.setLayoutProperty(
                        'ballard-trees-points',
                        'visibility',
                        event.target.checked ? 'visible' : 'none'
                    );
                });
               // Click a tree to see its tree information
            map.on('click', 'ballard-trees-points', function (event) {
                const properties = event.features[0].properties;

                new mapboxgl.Popup()
                    .setLngLat(event.lngLat)
                    .setHTML(
                        '<strong>tree:</strong> ' +
                        (properties.COMMON_NAME || 'Unknown') +
                        '<br><strong>Scientific name:</strong> ' +
                        (properties.SCIENTIFIC_NAME ?? 'Unknown')
                    )
                    .addTo(map);
            });

            map.on('mouseenter', 'ballard-trees-points', function () {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'ballard-trees-points', function () {
                map.getCanvas().style.cursor = '';
            });

        });

        // Log loading errors in the browser console
        map.on('error', function (event) {
            console.error('Map error:', event.error);
        });
    </script>

</body>
</html>
