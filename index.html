
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seattle Map</title>

    <!-- Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- Map -->
    <div id="map"></div>

    <!-- Mapbox JavaScript -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>

    <script>
        // Your Mapbox access token
        mapboxgl.accessToken = 'pk.eyJ1IjoiaG1lcnJpdHQxMSIsImEiOiJjbWhqcHRpOWgxMjA1MmxwbjdqY2x2dzdiIn0.Y0OZ2_z34S1hWXsgpOP19A';

        // Create the map
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-122.3321, 47.6062],
            zoom: 11

            map.addSource('tree-grid', {
                type: 'geojson',
                data: 'https://raw.githubusercontent.com/hannahmerritt/tree_map/refs/heads/main/data/grid_points_trees_test_area.geojson%202'
            });

            map.addLayer({
                id: 'tree-grid-points',
                type: 'circle',
                source: 'tree-grid',
                paint: {
                    'circle-radius': 7,
            
                    'circle-color': [
                        'match',
                        ['get', 'catgory'],
                        1, '#e76f51',
                        2, '#e9c46a',
                        3, '#2a9d8f',
                        4, '#8ab17d',
                        5, '#577590',
                        6, '#b07aa1',
                        7, '#6d597a',
                        8, '#8d99ae',
                        '#cccccc'
                    ],
            
                    'circle-opacity': [
                        'interpolate',
                        ['linear'],
                        ['to-number', ['get', 'Ratio']],
                        0, 0.2,
                        1, 0.9
                    ],
            
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 0.5
                }
            });
        });

        map.on('load', () => {
    // Load the Ballard tree data
            map.addSource('ballard-trees', {
                type: 'geojson',
                data: 'data/ballard_trees.geojson'
            });
        
            // Display each tree as a circle
            map.addLayer({
                id: 'ballard-trees-points',
                type: 'circle',
                source: 'ballard-trees',
                paint: {
                    'circle-radius': 4,
                    'circle-color': '#228B22',
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 0.5
                }
            });
        });

        // Add zoom and rotation controls
        map.addControl(new mapboxgl.NavigationControl());

        map.addSource('trees', {
            type: 'geojson',
            data: 'data/seattle_trees.geojson'
        });
    </script>

</body>

</html>
